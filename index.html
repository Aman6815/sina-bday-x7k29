<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>For Sina 💜</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;1,500&family=Nunito:wght@400;700&family=Noto+Sans+Ethiopic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#1b0b3a;--bg2:#5b2a9e;--gold:#f3c969;--lav:#e6d9ff;--glass:rgba(255,255,255,.12)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Nunito,'Noto Sans Ethiopic',sans-serif;color:#fff;background:radial-gradient(circle at 20% 10%,var(--bg2),var(--bg1) 70%) fixed;overflow-x:hidden}
h1,h2{font-family:Fraunces,'Noto Sans Ethiopic',serif;font-weight:500;line-height:1.2}
h1{font-size:clamp(2rem,8vw,3.2rem)}h2{font-size:clamp(1.5rem,6vw,2.1rem);margin-bottom:.8rem}
p{line-height:1.6;margin:.5rem 0}
.s{display:none;min-height:100%;padding:4.2rem 1.2rem 2rem;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.8rem;max-width:560px;margin:auto;position:relative;z-index:2}
.s.on{display:flex;animation:in .6s}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.card{background:var(--glass);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.22);border-radius:22px;padding:1.2rem;width:100%}
button{font:inherit;font-weight:700;border:0;border-radius:99px;padding:.8rem 1.4rem;background:var(--gold);color:#2a1050;cursor:pointer;transition:transform .15s}
button:active{transform:scale(.95)}
button.o{display:block;width:100%;margin:.4rem 0;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);font-weight:400;padding:.75rem 1rem;border-radius:14px}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
#lang{position:fixed;top:.8rem;top:max(.8rem,env(safe-area-inset-top));right:.8rem;z-index:20;padding:.4rem .9rem;font-size:.85rem;background:var(--glass);color:#fff;border:1px solid rgba(255,255,255,.3)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.f{position:absolute;bottom:-30px;animation:up linear forwards}
@keyframes up{to{transform:translateY(-110vh) rotate(40deg);opacity:0}}
.big{font-size:4.5rem;animation:bob 2s infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.gal{display:flex;gap:1rem;overflow-x:auto;scroll-snap-type:x mandatory;width:100%;padding:1rem .2rem}
.pol{flex:0 0 78%;scroll-snap-align:center;background:#fff;color:#3a2060;padding:.7rem .7rem 1rem;border-radius:6px;box-shadow:0 8px 24px #0006}
.pol:nth-child(odd){transform:rotate(-2deg)}.pol:nth-child(even){transform:rotate(2deg)}
.pol img{width:100%;height:340px;object-fit:cover;object-position:top;display:block;border-radius:3px}
.pol p{font-family:Fraunces,serif;font-style:italic;margin:.6rem 0 0}
.env{font-size:1rem}
#back{position:fixed;top:.8rem;top:max(.8rem,env(safe-area-inset-top));left:.8rem;z-index:20;padding:.5rem 1.1rem;font-size:.95rem;background:var(--gold);color:#2a1050;border:0;box-shadow:0 4px 14px #0006}
.view{display:flex;align-items:center;gap:.4rem;width:100%}
.ar{flex:0 0 46px;height:46px;padding:0;font-size:2rem;line-height:1;display:grid;place-items:center}
.view .pol{flex:1;min-width:0;transform:rotate(-1.5deg);transition:opacity .25s}
.view .pol img{height:min(52vh,420px)}
.cnt{font-size:.9rem;opacity:.8}
.thumbs{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap}
.thumbs img{width:54px;height:54px;object-fit:cover;object-position:top;border-radius:10px;border:3px solid transparent;opacity:.6;cursor:pointer}
.thumbs img.on{border-color:var(--gold);opacity:1}
.letter{margin-top:.8rem;min-height:5rem}
.cake{position:relative;width:180px;margin:1rem auto 0}
.cand{display:flex;justify-content:space-around;height:60px;align-items:flex-end}
.cand span{cursor:pointer;font-size:1.6rem;user-select:none;transition:opacity .4s}
.cand span.off{opacity:.25;filter:grayscale(1)}
.base{height:80px;background:linear-gradient(#ff9ad5 30%,#b66cf0 30%);border-radius:10px 10px 18px 18px}
.plate{height:12px;background:var(--lav);border-radius:99px;margin-top:-3px}
#wrap{position:relative;width:300px;max-width:80vw;margin:.5rem auto}
#wrap:before{content:"▼";position:absolute;top:-16px;left:50%;transform:translateX(-50%);color:var(--gold);font-size:1.8rem;z-index:3}
#wheel{width:100%;display:block;border-radius:50%;box-shadow:0 0 0 6px var(--gold),0 10px 30px #0008;transition:transform 4.2s cubic-bezier(.12,.7,.1,1)}
input,select{font:inherit;width:100%;padding:.75rem;border-radius:12px;border:0;margin:.3rem 0}
.row{display:flex;gap:.5rem}.row>*{flex:1}
audio{width:100%}
.hide{display:none!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style></head><body>
<button id="back" class="hide" data-k="back" onclick="goBack()"></button>
<button id="lang" aria-label="Language">አማርኛ</button>
<div id="fx"></div>

<section class="s on" id="s0">
 <h2 data-k="gateT"></h2><p data-k="gateP"></p>
 <div class="card"><p id="gq" style="font-weight:700"></p><div id="go"></div><p id="gh" style="min-height:1.6rem;color:var(--gold)"></p></div>
</section>
<section class="s" id="s1"><div class="big">🔓</div><h1 data-k="acc"></h1><p data-k="wel"></p><p data-k="start"></p><button data-k="next" onclick="go(2)"></button></section>
<section class="s" id="s2"><p data-k="some"></p><div class="big">🎁</div><button data-k="open" onclick="boom();go(3)"></button></section>
<section class="s" id="s3"><h1 data-k="hb"></h1><div class="card"><p data-k="msg"></p></div><button data-k="next" onclick="go(4)"></button></section>
<section class="s" id="s4" style="max-width:640px"><h2 data-k="galT"></h2><p data-k="galP"></p><div class="view"><button class="ar" onclick="shift(-1)" aria-label="Previous photo">‹</button><div class="pol" id="pol"><img id="pimg" alt=""><p id="pcap"></p></div><button class="ar" onclick="shift(1)" aria-label="Next photo">›</button></div><p class="cnt" id="cnt"></p><div class="thumbs" id="thumbs"></div><button data-k="next" onclick="go(5)"></button></section>
<section class="s" id="s5"><h2 data-k="envT"></h2><div class="card" id="envs"></div><div class="card letter" id="letter" data-k="tap"></div><button data-k="next" onclick="go(6)"></button></section>
<section class="s" id="s6"><h2 data-k="quizT"></h2><div class="card" id="qz"></div></section>
<section class="s" id="s7"><h2 data-k="cakeT"></h2><p data-k="cakeP"></p><div class="cake"><div class="cand" id="cand"></div><div class="base"></div><div class="plate"></div></div><h2 id="wish" class="hide" data-k="wish"></h2><button id="cn" class="hide" data-k="next" onclick="go(8)"></button></section>
<section class="s" id="s8"><h2 data-k="audT"></h2><div class="card"><div class="big" style="font-size:3rem">🎙️</div><p data-k="audP"></p><audio id="au" controls></audio><p id="noau" class="hide" data-k="noau"></p></div><button data-k="next" onclick="go(9)"></button></section>
<section class="s" id="s9"><h2 data-k="spinT"></h2><p id="spinP"></p><p id="last" style="min-height:1.5rem;color:var(--gold);font-weight:700"></p>
 <div id="wrap"><canvas id="wheel" width="600" height="600"></canvas></div>
 <button id="spinB" data-k="spin" onclick="spin()"></button>
 <div class="card hide" id="claim"><p id="res" style="font-weight:700"></p>
  <select id="meth"><option value="CBE">CBE</option><option value="TeleBirr">TeleBirr</option></select>
  <input id="num" inputmode="numeric" data-ph="numPh">
  <p style="font-size:.85rem" data-k="sendNote"></p>
  <button data-k="claimB" onclick="claim()"></button></div>
 <p id="done" class="hide" data-k="done"></p>
 <button id="fn" class="hide" data-k="next" onclick="go(10)"></button></section>
<section class="s" id="s10"><img id="fin" alt="" style="width:80%;max-width:300px;border-radius:50%;aspect-ratio:1;object-fit:cover;object-position:top;border:5px solid var(--gold)"><h1 data-k="finH"></h1><p data-k="finP"></p><p>— Amanuel 💜</p></section>

go:[["ሲና","መስክ","እንፍ","በምንም ቅጽል ስም አልጠራሽም"],["እኔ (ሲና)","አማኑኤል","ሁለታችንም እኩል"],["አማኑኤልን በደንብ አውቀዋለሁ","አማኑኤል እኔን በደንብ ያውቀኛል","እኩል ነን፣ ግልጽ ነው"]],
gok:[3,0,0],gbad:["እንደገና አስቢ 🤔","አጠራጣሪ ነው… 😏","ስህተት መልስ አለ 😄"],gokM:"ትክክል! ✨",
env:[["መጥፎ ቀን ሲኖርሽ","ትንፋሽ ውሰጂ። እኔ የማውቀው እጅግ ታጋሽ ሰው ነሽ። ዛሬ ለራስሽም ታገሺ። ይህም ቀን ያልፋል።"],
["ራስሽን ስትጠራጠሪ","ግጥም ትጽፊያለሽ፣ ምህንድስና ትማሪያለሽ፣ ቦርሳ በእጅሽ ትሰሪያለሽ። ጥርጣሬ በደንብ አያውቅሽም።"],
["መሳቅ ስትፈልጊ","አስቂኝ እውነት፦ እጅሽ ሁሌ ቀዝቃዛ እንደሆነ የማውቀው ከአንቺ የነካሁት ብቸኛው ነገር እጅሽ ስለሆነ ነው። አትጨነቂ፣ ጨዋ ነኝ! 😂"],
["ኩራት ሲሰማሽ","ከመጀመሪያ ደረጃ ትምህርት ቤት እስከ ዩኒቨርሲቲ ምህንድስና መጥተሻል። ልትኮሪ ይገባል፤ እኔ ሁሌም እኮራብሻለሁ።"]],
q:[["መጀመሪያ የት ተገናኘን?",["መብራተ ሃይል ትምህርት ቤት","ወላይታ ሶዶ ዩኒቨርሲቲ","ድግስ ላይ"],0],
["በሜሴንጀር ማውራት የጀመርኩት በስንተኛ ክፍል ነው?",["8ኛ ክፍል","6ኛ ክፍል","10ኛ ክፍል"],0],
["የሲና ሚስጥራዊ ልዕለ ኃይል ምንድን ነው?",["ሁሌ ቀዝቃዛ እጆች ❄️","የቸኮሌት ራዳር 🍫","መቼም አለማርፈድ"],0]]

let lang='en',gi=0,qi=0,cur=0,spins=[],left=3,spinning=false,wr=0;
const $=id=>document.getElementById(id),T=k=>L[lang][k];
const PRIZES=[50,100,150,200,300,500],COL=['#f3c969','#b66cf0','#e08ad8','#7b3fd1','#d9a93f','#4b1d8f'],N=6,SEG=360/N,WIN=4; // only the first 4 (50,100,150,200) can win
let hist=[0];
function go(n,bk){document.querySelectorAll('.s').forEach(s=>s.classList.remove('on'));$('s'+n).classList.add('on');if(!bk&&hist[hist.length-1]!=n)hist.push(n);$('back').classList.toggle('hide',n<1);window.scrollTo(0,0)}
function goBack(){if(spinning||hist.length<2)return;hist.pop();const n=hist[hist.length-1];if(n==0){gi=0;gate();$('gh').textContent=''}go(n,1)}
function fx(list,n){for(let i=0;i<n;i++){const e=document.createElement('span');e.className='f';e.textContent=list[i%list.length];e.style.cssText=`left:${Math.random()*100}%;font-size:${14+Math.random()*22}px;animation-duration:${4+Math.random()*5}s`;$('fx').appendChild(e);setTimeout(()=>e.remove(),9500)}}
function boom(){fx(['🎉','✨','💜','⭐','🎊'],40)}
setInterval(()=>fx(['💜','✨','⭐'],1),1400);
function paint(){
 document.querySelectorAll('[data-k]').forEach(e=>{const v=T(e.dataset.k);if(typeof v=='string')e.textContent=v});
 document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=T(e.dataset.ph));
 $('lang').textContent=lang=='en'?'አማርኛ':'English';document.documentElement.lang=lang=='en'?'en':'am';
 gate();gal();envs();quiz();wheelTxt();
}
function gate(){if(gi>2)return;$('gq').textContent=T('gq')[gi];$('go').innerHTML='';T('go')[gi].forEach((t,i)=>{const b=document.createElement('button');b.className='o';b.textContent=t;b.onclick=()=>{if(i==T('gok')[gi]){$('gh').textContent=T('gokM');boom();gi++;setTimeout(()=>{$('gh').textContent='';gi>2?go(1):gate()},700)}else{$('gh').textContent=T('gbad')[gi];b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400)}};$('go').appendChild(b)})}
let pi=0;
function gal(){$('thumbs').innerHTML=PICS.map((p,k)=>`<img src="${p.s}" alt="" onclick="show(${k})">`).join('');$('fin').src=PICS[0].s;show(pi)}
function show(k){pi=(k+PICS.length)%PICS.length;const p=PICS[pi];$('pimg').src=p.s;$('pcap').textContent=p[lang];$('cnt').textContent=(pi+1)+' / '+PICS.length;[...$('thumbs').children].forEach((e,x)=>e.classList.toggle('on',x==pi))}
function shift(d){show(pi+d)}
let tx=0;$('pol').addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});$('pol').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>40)shift(d<0?1:-1)});
document.addEventListener('keydown',e=>{if($('s4').classList.contains('on')){if(e.key=='ArrowRight')shift(1);if(e.key=='ArrowLeft')shift(-1)}});
function envs(){$('envs').innerHTML='';T('env').forEach(([t,m])=>{const b=document.createElement('button');b.className='o env';b.textContent='✉️ '+t;if(lang=='en')b.textContent='✉️ Open when '+(t.startsWith('a ')?'you\'re having '+t:t);b.onclick=()=>{$('letter').textContent=m;fx(['💌','💜'],8)};$('envs').appendChild(b)});}
function quiz(){const q=T('q')[qi],d=$('qz');if(!q){d.innerHTML=`<p style="font-size:1.2rem">${T('pass')}</p>`;if(!d.nextBtn){d.nextBtn=1;const b=document.createElement('button');b.textContent=T('next');b.onclick=()=>go(7);d.after(b)}boom();return}
 d.innerHTML=`<p style="font-weight:700">${q[0]}</p>`;q[1].forEach((t,i)=>{const b=document.createElement('button');b.className='o';b.textContent=t;b.onclick=()=>{if(i==q[2]){qi++;quiz()}else{b.classList.add('shake');b.textContent=T('wrong');setTimeout(()=>quiz(),700)}};d.appendChild(b)})}

let lit=5;$('cand').innerHTML='🕯️'.repeat(5).match(/./gu)?[...Array(5)].map(()=>'<span>🔥</span>').join(''):'';
$('cand').onclick=e=>{if(e.target.tagName!='SPAN'||e.target.classList.contains('off'))return;e.target.classList.add('off');e.target.textContent='💨';if(--lit==0){$('wish').classList.remove('hide');$('cn').classList.remove('hide');boom()}};

const au=$('au');au.src=AUDIO;au.onerror=()=>{au.classList.add('hide');$('noau').classList.remove('hide')};

const cv=$('wheel'),cx=cv.getContext('2d');
(function(){const r=300,a=2*Math.PI/N;PRIZES.forEach((p,i)=>{cx.beginPath();cx.moveTo(r,r);cx.arc(r,r,r,-Math.PI/2+i*a,-Math.PI/2+(i+1)*a);cx.fillStyle=COL[i];cx.fill();cx.save();cx.translate(r,r);cx.rotate(-Math.PI/2+(i+.5)*a);cx.fillStyle=(i==0||i==4)?'#2a1050':'#fff';cx.font='bold 50px Nunito,sans-serif';cx.textAlign='right';cx.fillText(p,r-40,18);cx.restore()})})();
function wheelTxt(){$('spinP').textContent=left>0?T('spinN')(left):''}
function spin(){if(spinning||left<1)return;spinning=true;$('last').textContent='';$('back').classList.add('hide');
 const W=[30,30,30,10],r=Math.random()*100;let i=0,acc=0;for(;i<WIN-1;i++){acc+=W[i];if(r<acc)break;} // 50/100/150 equal, 200 rare (10%) // ONLY 50, 100, 150 or 200
 wr=(Math.floor(wr/360)+6)*360-(i*SEG+SEG/2)+(Math.random()*30-15);
 cv.style.transform=`rotate(${wr}deg)`;
 const k=Math.floor((((-wr)%360)+360)%360/SEG); // segment really under the pointer
 setTimeout(()=>{spinning=false;$('back').classList.remove('hide');const w=PRIZES[k];spins.push(w);left--;boom();wheelTxt();
  $('last').textContent=(lang=='en'?'You won ':'አሸነፍሽ ')+w+' ETB! 🎉';
  if(left==0){$('spinB').classList.add('hide');$('claim').classList.remove('hide');$('res').textContent=`${T('resT')}: ${spins.join(' + ')} = ${spins.reduce((a,b)=>a+b)} ETB`}},4400)}
function claim(){const n=$('num').value.trim();if(n.length<5){alert(T('bad'));return}
 const tot=spins.reduce((a,b)=>a+b);
 const msg=`Sina's spin results: ${spins.join(' + ')} = ${tot} ETB. ${$('meth').value}: ${n}`;
 window.open('https://t.me/Abuchu135?text='+encodeURIComponent(msg),'_blank');
 $('claim').classList.add('hide');$('done').classList.remove('hide');$('fn').classList.remove('hide')}
$('lang').onclick=()=>{lang=lang=='en'?'am':'en';paint()};
paint();
</script></body></html>
